name: Harmony Build

on:
  push:
    branches: ["main", "dev-*"]
  pull_request:
    branches: ["main", "dev-*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harmony-build:
    runs-on: ubuntu-latest
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:v5.0.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-package-lock
      - run: npm run typecheck:harmony
      - run: npm run build:har

  # OpenHarmony userland from https://github.com/czl-leo/dockerharmony.
  # GitHub-hosted arm64 runner; the image has no bash, hvigor, or ohpm.
  harmony-test:
    runs-on: ubuntu-24.04-arm
    container:
      image: hqzing/dockerharmony:latest
      volumes:
        - /opt/node24:/__e/node24:rw,rshared
    timeout-minutes: 60
    defaults:
      run:
        shell: sh
    steps:
      - name: Setup node for actions
        run: |
          set -eu
          curl -L -O https://github.com/hqzing/ohos-node/releases/download/v24.2.0/node-v24.2.0-openharmony-arm64.tar.gz
          mkdir -p /__e/node24/bin /opt
          tar -zxf node-v24.2.0-openharmony-arm64.tar.gz -C /opt
          ln -sf /opt/node-v24.2.0-openharmony-arm64/bin/node /__e/node24/bin/node
          echo "/opt/node-v24.2.0-openharmony-arm64/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v5
      - name: Record image toolchain
        run: |
          echo "PATH=$PATH"
          for cmd in node npm hvigorw ohpm java python3 curl; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "found $cmd: $(command -v "$cmd")"
            else
              echo "missing $cmd"
            fi
          done
          node -v || true
          npm -v || true
      - run: npm install --no-package-lock
      - run: npm run stage:har
      - name: Install ohpm dependencies
        working-directory: ohos-har
        run: ohpm install --all
      - name: Run ArkTS unit tests
        run: npm run test:harmony
      - name: Publish test log
        if: always()
        run: |
          result=ohos-har/oss-v2/.test/default/intermediates/test/coverage_data/test_result.txt
          if [ -f "$result" ]; then
            echo "## ArkTS unit tests (dockerharmony)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$result" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmony-unit-test-dockerharmony
          path: |
            ohos-har/oss-v2/.test/default/intermediates/test/coverage_data/test_result.txt
            ohos-har/oss-v2/.test/default/outputs/test/reports/
          if-no-files-found: warn

  # Mate 60 is the device, not a GitHub runner. Register a Windows self-hosted
  # runner with label `mate60` on the PC that has the phone on USB. Skip fork PRs.
  harmony-test-mate60:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, mate60]
    timeout-minutes: 60
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: Locate preinstalled HarmonyOS tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Add-Bin([string]$dir) {
            if (Test-Path -LiteralPath $dir) {
              [System.IO.File]::AppendAllText($env:GITHUB_PATH, ($dir + [Environment]::NewLine))
            }
          }
          Add-Bin 'E:\DevEco Studio\jbr\bin'
          Add-Bin 'E:\DevEco Studio\tools\hvigor\bin'
          Add-Bin 'E:\DevEco Studio\tools\ohpm\bin'
          Add-Bin 'E:\DevEco Studio\tools\node'
          Add-Bin 'E:\DevEco Studio\sdk\default\openharmony\toolchains'
          if (Test-Path -LiteralPath 'E:\DevEco Studio\sdk') {
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "DEVECO_SDK_HOME=E:\DevEco Studio\sdk$([Environment]::NewLine)")
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "NODE_HOME=E:\DevEco Studio\tools\node$([Environment]::NewLine)")
          }
          if ($env:HARMONY_CLT_HOME) { Add-Bin (Join-Path $env:HARMONY_CLT_HOME 'bin') }
          Add-Bin (Join-Path $env:USERPROFILE 'command-line-tools\bin')
          Add-Bin 'C:\Program Files\Huawei\command-line-tools\bin'
          Add-Bin 'C:\Program Files\Tools\command-line-tools\bin'
          Add-Bin 'C:\Program Files\Huawei\DevEco Studio\jbr\bin'
          Add-Bin 'C:\Program Files\Huawei\DevEco Studio\tools\hvigor\bin'
          Add-Bin 'C:\Program Files\Huawei\DevEco Studio\tools\ohpm\bin'
          Add-Bin 'C:\Program Files\Huawei\DevEco Studio\tools\node'
          Add-Bin 'C:\Program Files\Huawei\DevEco Studio\sdk\default\openharmony\toolchains'
      - name: Check DevEco tools
        run: |
          where node
          where java
          where hvigorw
          where ohpm
          node -v
          java -version
      - run: npm install --no-package-lock
      - run: npm run stage:har
      - name: Install ohpm dependencies
        working-directory: ohos-har
        run: ohpm install --all
      - name: Run ArkTS unit tests
        run: npm run test:harmony
      - name: Require Mate 60 on hdc
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $hdc = Get-Command hdc.exe -ErrorAction SilentlyContinue
          if (-not $hdc) {
            Write-Host '::error::hdc not on PATH. Install DevEco / command-line-tools on the Mate 60 host.'
            exit 1
          }
          $targets = (& hdc.exe list targets 2>&1 | Out-String).Trim()
          Write-Output $targets
          if ([string]::IsNullOrWhiteSpace($targets) -or $targets -match '(?i)\[Empty\]' -or $targets -match '(?i)^Empty$') {
            Write-Host '::error::No HarmonyOS device. Connect Mate 60, enable USB debugging, and authorize this PC.'
            exit 1
          }
      - run: npm run build:har
      - name: Install the har and sample test dependencies
        working-directory: samples/harmony/entry
        shell: cmd
        run: |
          set "HAR="
          for %%f in (..\..\..\alicloud-oss-v2-*.har) do set "HAR=%%~ff"
          if not exist "%HAR%" (
            echo ::error::Built HAR not found under the repository root.
            exit /b 1
          )
          echo Installing %HAR%
          ohpm install --no-save "%HAR%" @ohos/hypium@1.0.19 @ohos/hamock@1.0.0
      - name: Run device tests on Mate 60
        run: node scripts/run-harmony-device-test-local.mjs
      - name: Publish unit-test log
        if: always()
        shell: cmd
        run: |
          if exist ohos-har\oss-v2\.test\default\intermediates\test\coverage_data\test_result.txt (
            echo ## ArkTS unit tests (Mate 60 host)>>"%GITHUB_STEP_SUMMARY%"
            echo ```>>"%GITHUB_STEP_SUMMARY%"
            type ohos-har\oss-v2\.test\default\intermediates\test\coverage_data\test_result.txt>>"%GITHUB_STEP_SUMMARY%"
            echo ```>>"%GITHUB_STEP_SUMMARY%"
          )
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmony-test-mate60
          path: |
            ohos-har/oss-v2/.test/default/intermediates/test/coverage_data/test_result.txt
            samples/harmony/entry/build/**/*.hap
          if-no-files-found: warn
